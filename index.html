    <!-- Early-prime homepage snapshot fetch. Runs in parallel with JS download.
         Result is parked on window.__HOME_SNAPSHOT__ so React reads it synchronously
         (0 round-trip before first paint). Also emits a <link rel="preload"> for the
         LCP image as soon as the snapshot arrives. -->
    <script>
      (function() {
        try {
          var path = location.pathname;
          if (path !== "/test") return;
          var params = new URLSearchParams(location.search);
          var city = params.get("city");
          if (!city) {
            try { city = localStorage.getItem("oneworld:lastHomepageCity"); } catch (e) {}
          }
          if (!city) return;
          var url = "https://plnphgdrawpsnumnejzc.supabase.co/rest/v1/homepage_cards_snapshots?select=payload&city=eq." + encodeURIComponent(city);
          var anon = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsbnBoZ2RyYXdwc251bW5lanpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyNjA5ODcsImV4cCI6MjA4NTgzNjk4N30.RwHKmL6E0Gd2LTVvDkfYx5RkZ-k7LKKp4iUoCS34pW4";
          window.__HOME_SNAPSHOT_CITY__ = city;
          window.__HOME_SNAPSHOT__ = fetch(url, {
            headers: { apikey: anon, Authorization: "Bearer " + anon, Accept: "application/json" }
          })
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(rows) {
              var payload = (rows && rows[0] && rows[0].payload) || null;
              if (payload && payload[0] && payload[0].data) {
                var t = payload[0].data.thumbnail;
                if (t) {
                  var u = t;
                  // MUST match optimizeSupabaseImage(url, { width: 400 }) in src/pages/Home.tsx
                  // (width=400, quality=70, resize=contain) — otherwise the preloaded bytes
                  // differ from what React actually requests and the preload is wasted.
                  if (/\/storage\/v1\/object\/public\//.test(t) && !/\?/.test(t)) {
                    u = t.replace("/object/public/", "/render/image/public/") + "?width=400&quality=70&resize=contain";
                  }
                  var link = document.createElement("link");
                  link.rel = "preload"; link.as = "image"; link.href = u;
                  link.setAttribute("fetchpriority", "high");
                  document.head.appendChild(link);
                }
              }
              return payload;
            })
            .catch(function() { return null; });
        } catch (e) {}
      })();
    </script>

    <script>
      // Widgets embarqués (/embed/*) : aucun fond beige avant le montage React.
      // Le fond éventuel est décidé ensuite par les réglages du widget.
      (function () {
        try {
          if (!/^\/embed\//.test(location.pathname)) return;
          var s = document.createElement("style");
          s.textContent =
            "html,body,#root{background:transparent!important;background-color:transparent!important}" +
            "#root>div[aria-hidden='true']{display:none!important}";
          document.head.appendChild(s);
          // Chromium peint le fond de base d'une iframe transparente avec le
          // "color-adjust background" dès que le color-scheme de l'iframe diffère
          // de celui du document hôte (→ blanc si l'hôte est dark et l'iframe light).
          // preset=overlay et canvas=transparent = usages internes sur fond sombre :
          // aligner le canvas AVANT le montage React évite tout flash blanc initial.
          var isOverlay = /(^|[?&])preset=overlay(&|$)/.test(location.search);
          var isTransparentCanvas = /(^|[?&])canvas=transparent(&|$)/.test(location.search);
          var metas = document.querySelectorAll('meta[name="color-scheme"]');
          for (var i = 0; i < metas.length; i++) metas[i].parentNode.removeChild(metas[i]);
          if (isOverlay || isTransparentCanvas) {
            document.documentElement.style.setProperty("color-scheme", "dark");
          } else {
            // Embed réel chez l'hôte : color-scheme LIGHT obligatoire, sinon
            // Chromium peint le canvas de l'iframe transparente en sombre.
            document.documentElement.style.setProperty("color-scheme", "light");
          }



        } catch (e) {}
      })();
    </script>
