name: Rendu des vidéos Studio

on:
  schedule:
    - cron: "*/5 * * * *" # Toutes les 5 minutes
  workflow_dispatch: {}

concurrency:
  group: render-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer FFmpeg, Chromium & deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 || \
          sudo apt-get install -y ffmpeg chromium libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      # Capture des vidéos « Feed » : Playwright Python + Pillow (détourage alpha).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Playwright Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium


      - name: Cache Bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            remotion/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('remotion/package.json') }}

      - name: Cache Remotion Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-chrome-${{ runner.os }}

      - name: Installer les dépendances
        working-directory: remotion
        run: bun install

      - name: Lancer le rendu de la file d'attente
        working-directory: remotion
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          MAX_JOBS: "10"
        run: bun run scripts/render-job.mjs
