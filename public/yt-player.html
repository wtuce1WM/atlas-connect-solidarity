<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>player</title>
<style>
  html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden}
  #player,#player iframe{position:absolute;inset:0;width:100%!important;height:100%!important;border:0}
</style>
</head>
<body>
<div id="player"></div>
<script>
  var params = new URLSearchParams(location.search);
  var videoId = (params.get('id') || '').replace(/[^\w-]/g, '').slice(0, 11);
  var startAt = Math.max(0, Math.floor(Number(params.get('t') || '0')));
  var autoplay = params.get('autoplay') !== '0';
  var startMuted = params.get('mute') !== '0';
  var loop = params.get('loop') === '1';
  if (!videoId || videoId.length !== 11) {
    document.body.innerHTML = '<div style="color:#fff;font-family:sans-serif;padding:20px">Invalid id</div>';
  } else {
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    var ytPlayer = null;
    var pendingCommands = [];

    // L'iframe YouTube est créée ICI (et non par YT.Player) pour porter
    // explicitement `allow="autoplay"`. Sans cet attribut, Safari/iOS refuse
    // l'auto-lecture d'une iframe cross-origin, même en mode muet : la vidéo
    // restait sur son écran de démarrage jusqu'à un clic Play manuel.
    function buildIframe() {
      var q = [
        'enablejsapi=1',
        'autoplay=' + (autoplay ? 1 : 0),
        'mute=' + (startMuted ? 1 : 0),
        'controls=0', 'rel=0', 'modestbranding=1', 'playsinline=1',
        'iv_load_policy=3', 'fs=0', 'disablekb=1',
        'start=' + startAt,
        'origin=' + encodeURIComponent(location.origin)
      ];
      if (loop) q.push('loop=1', 'playlist=' + videoId);
      var f = document.createElement('iframe');
      f.id = 'yt-frame';
      f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
      f.setAttribute('allowfullscreen', '');
      f.setAttribute('frameborder', '0');
      f.setAttribute('title', 'video');
      f.src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?' + q.join('&');
      var holder = document.getElementById('player');
      holder.innerHTML = '';
      holder.appendChild(f);
      return f;
    }
    var frame = buildIframe();

    function exec(cmd) {
      if (!ytPlayer) return;
      try {
        if (cmd.func === 'playVideo') ytPlayer.playVideo();
        else if (cmd.func === 'pauseVideo') ytPlayer.pauseVideo();
        else if (cmd.func === 'mute') ytPlayer.mute();
        else if (cmd.func === 'unMute') ytPlayer.unMute();
        else if (cmd.func === 'setVolume' && cmd.args && cmd.args.length) ytPlayer.setVolume(cmd.args[0]);
        else if (cmd.func === 'seekTo' && cmd.args && cmd.args.length) ytPlayer.seekTo(cmd.args[0], true);
      } catch (_) {}
    }
    window.addEventListener('message', function(evt) {
      var data = evt.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch (_) { return; }
      }
      if (!data || data.event !== 'command') return;
      if (!ytPlayer) pendingCommands.push(data);
      else exec(data);
    });

    // Relais d'état vers le parent : le panneau doit connaître l'état réel
    // (lecture / muet) pour ses CTA Play et Son.
    function relay(state) {
      try {
        var muted = null;
        try { muted = ytPlayer ? ytPlayer.isMuted() : null; } catch (_) {}
        parent.postMessage(JSON.stringify({
          event: 'infoDelivery',
          owm: 'yt-player',
          info: { playerState: state, muted: muted }
        }), '*');
      } catch (_) {}
    }

    // Relance d'auto-lecture : certains navigateurs ignorent `autoplay=1`
    // quand l'iframe est créée pendant une animation d'ouverture de panneau.
    function kickAutoplay() {
      if (!autoplay || !ytPlayer) return;
      var tries = 0;
      var id = setInterval(function () {
        tries++;
        var st = -1;
        try { st = ytPlayer.getPlayerState(); } catch (_) {}
        if (st === 1 || st === 3 || tries > 8) { clearInterval(id); return; }
        try { if (startMuted) ytPlayer.mute(); ytPlayer.playVideo(); } catch (_) {}
      }, 500);
    }

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player(frame, {
        events: {
          onReady: function(e) {
            try { if (startMuted) e.target.mute(); else { e.target.unMute(); e.target.setVolume(100); } } catch(_) {}
            if (startAt > 0) { try { e.target.seekTo(startAt, true); } catch(_) {} }
            try { if (autoplay) e.target.playVideo(); } catch(_) {}
            pendingCommands.splice(0).forEach(exec);
            kickAutoplay();
          },
          onStateChange: function(e) {
            relay(e.data);
            if (loop && e.data === 0) { try { e.target.seekTo(startAt, true); e.target.playVideo(); } catch(_) {} }
          }
        }
      });
    };
  }
</script>
</body>
</html>
