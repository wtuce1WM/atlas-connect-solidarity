const names = Object.keys(DIAGRAMS.diagrams);
const tabs = document.getElementById("tabs");
const canvas = document.getElementById("canvas");
const stage = document.getElementById("stage");
let z=1,x=0,y=0,cur=null;
const apply=()=>canvas.style.transform=`translate(${x}px,${y}px) scale(${z})`;
async function render(name){
  cur=name;
  [...tabs.querySelectorAll("button[data-n]")].forEach(b=>b.classList.toggle("active",b.dataset.n===name));
  canvas.innerHTML="Rendu…";
  try{
    const {svg}=await mermaid.render("d"+Math.random().toString(36).slice(2), DIAGRAMS.diagrams[name]);
    canvas.innerHTML=svg;
  }catch(e){canvas.textContent="Erreur de rendu : "+e.message;}
  z=1;x=0;y=0;apply();
}
names.forEach(n=>{const b=document.createElement("button");b.dataset.n=n;b.textContent=`${n} (${DIAGRAMS.meta[n].tables})`;b.onclick=()=>render(n);tabs.appendChild(b);});
const tools=document.createElement("div");tools.className="tools";
const reset=document.createElement("button");reset.textContent="Réinitialiser";reset.onclick=()=>{z=1;x=0;y=0;apply();};
const dl=document.createElement("button");dl.textContent="Télécharger le SVG";dl.onclick=()=>{
  const svg=canvas.querySelector("svg");if(!svg)return;
  const blob=new Blob([svg.outerHTML],{type:"image/svg+xml"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`erd-${cur.replace(/[^a-z0-9]+/gi,"-").toLowerCase()}.svg`;a.click();
};
tools.append(reset,dl);tabs.appendChild(tools);
stage.addEventListener("wheel",e=>{e.preventDefault();
  const dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?100:1);
  const next=Math.min(4,Math.max(0.2,z*Math.exp(-dy*0.0015)));
  const r=stage.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,k=next/z;
